            .attr("transform", "translate(0," + height + ")")
            .call(d3.axisBottom(x).ticks(17).tickFormat(d3.format("d")));

        // Add X axis label
        svg.append("text")
            .attr("text-anchor", "middle")
            .attr("x", width / 2)
            .attr("y", height +40)
            .style("font-size", "12px")
            .style("font-weight", "bold")
            .text("Year");

        // Add Y axis (Nb of authors)
        var y = d3.scaleLinear()
            .domain([0, 8])
            .range([height, 0]);
        svg.append("g")
            .call(d3.axisLeft(y).ticks(6).tickFormat(function(d) {
                return (d ) ;
            }));

        // Add Y axis label
        svg.append("text")
            .attr("text-anchor", "middle")
            .attr("transform", "rotate(-90)")
            .attr("y", -45)
            .attr("x", -height / 2)
            .style("font-size", "14px")
            .style("font-weight", "bold")
            .text("Number of authors");

        // Add a scale for bubble size (number of citations)
        // Domain [0, 320] covers the actual citation range; minimum radius 4 keeps
        // zero-citation papers visible.
        var z = d3.scaleSqrt()
            .domain([0, 320])
            .range([4, 28]);

        // Add a scale for bubble color (topic)
        var myColor = d3.scaleOrdinal()
            .domain([
                "Fact-Checking / Truth Discovery",
                "Multimodal Fusion & Learning",
                "Applied Data Analytics & ML",
                "Data Quality / Data Cleaning",
                "Knowledge Engineering"
            ])
            .range(["#e74c3c", "#3498db", "#f39c12", "#9b59b6", "#1abc9c"]);

        // ---------------------------//
        //      TOOLTIP               //
        // ---------------------------//

        var tooltip = d3.select("#my_dataviz")
            .append("div")
            .style("opacity", 0)
            .attr("class", "tooltip")
            .style("background-color", "rgba(0, 0, 0, 0.9)")
            .style("border-radius", "8px")
            .style("padding", "12px")
            .style("color", "white")
            .style("box-shadow", "0 4px 6px rgba(0,0,0,0.1)");

        var showTooltip = function(d) {
            tooltip
                .transition()
                .duration(200)
                .style("opacity", 1);
            tooltip
                .html(
                    "<strong>" + d.title + "</strong><br/>" +
                    d.venue + " " + d.year + "<br/>" +
                    "Topic: " + d.topic + "<br/>" +
                    "Authors: " + d.authors + " · Citations: " + d.citations
                )
                .style("left", (d3.event.pageX + 15) + "px")
                .style("top", (d3.event.pageY - 28) + "px");
        };

        var moveTooltip = function(d) {
            tooltip
                .style("left", (d3.event.pageX + 15) + "px")
                .style("top", (d3.event.pageY - 28) + "px");
        };

        var hideTooltip = function(d) {
            tooltip
                .transition()
                .duration(200)
                .style("opacity", 0);
        };

        // ---------------------------//
        //       HIGHLIGHT GROUP      //
        // ---------------------------//

        var highlight = function(d) {
            d3.selectAll(".bubbles").style("opacity", 0.1);
            d3.selectAll("." + d.replace(/[^a-zA-Z0-9]/g, '_')).style("opacity", 1);
        };

        var noHighlight = function(d) {
            d3.selectAll(".bubbles").style("opacity", 0.85);
        };

        // ---------------------------//
        //       CIRCLES              //
        // ---------------------------//

        svg.append('g')
            .selectAll("dot")
            .data(data)
            .enter()
            .append("circle")
            .attr("class", function(d) {
                return "bubbles " + d.topic.replace(/[^a-zA-Z0-9]/g, '_');
            })
            .attr("cx", function(d) { return x(d.year); })
            .attr("cy", function(d) { return y(d.authors); })
            .attr("r", function(d) { return z(d.citations); })
            .style("fill", function(d) { return myColor(d.topic); })
            .on("mouseover", showTooltip)
            .on("mousemove", moveTooltip)
            .on("mouseleave", hideTooltip);

        // ---------------------------//
        //       LEGEND               //
        // ---------------------------//

        var legendLeft = width + 12;

        // --- Topic legend ---
        svg.append("text")
            .attr("x", legendLeft)
            .attr("y", 12)
            .text("Research Topics")
            .style("font-weight", "bold")
            .style("font-size", "12px");

        var allgroups = [
            "Fact-Checking / Truth Discovery",
            "Multimodal Fusion & Learning",
            "Applied Data Analytics & ML",
            "Data Quality / Data Cleaning",
            "Knowledge Engineering"
        ];

        svg.selectAll(".lgDot")
            .data(allgroups)
            .enter()
            .append("circle")
            .attr("class", "lgDot")
            .attr("cx", legendLeft + 7)
            .attr("cy", function(d, i) { return 28 + i * 18; })
            .attr("r", 7)
            .style("fill", function(d) { return myColor(d); })
            .style("cursor", "pointer")
            .on("mouseover", function(d) { highlight(d); })
            .on("mouseleave", function(d) { noHighlight(d); });

        svg.selectAll(".lgLbl")
            .data(allgroups)
            .enter()
            .append("text")
            .attr("class", "lgLbl")
            .attr("x", legendLeft + 18)
            .attr("y", function(d, i) { return 28 + i * 18; })
            .style("fill", function(d) { return myColor(d); })
            .text(function(d) { return d; })
            .style("font-size", "11px")
            .attr("alignment-baseline", "middle")
            .style("cursor", "pointer")
            .on("mouseover", function(d) { highlight(d); })
            .on("mouseleave", function(d) { noHighlight(d); });

        // --- Citation size legend ---
        // starts 22px below the last topic item (y = 28 + 4*18 = 100)
        var citHeaderY = 28 + 5 * 18 + 22;   // = 140

        svg.append("text")
            .attr("x", legendLeft)
            .attr("y", citHeaderY)
            .text("# Citations")
            .style("font-weight", "bold")
            .style("font-size", "12px");

        var valuesToShow = [0, 100, 300];
        var xCircle   = legendLeft + 55;
        var xLabel    = legendLeft + 110;
        // bottom y of the largest circle; leave 20px below header
        var citBottom = citHeaderY + 20 + z(300) * 2 + 5;

        svg.selectAll(".szCircle")
            .data(valuesToShow)
            .enter()
            .append("circle")
            .attr("class", "szCircle")
            .attr("cx", xCircle)
            .attr("cy", function(d) { return citBottom - z(d); })
            .attr("r", function(d) { return z(d); })
            .style("fill", "none")
            .attr("stroke", "#666");

        // lines from top of each circle to label column
        svg.selectAll(".szLine")
            .data(valuesToShow)
            .enter()
            .append("line")
            .attr("class", "szLine")
            .attr("x1", function(d) { return xCircle + z(d); })
            .attr("x2", xLabel)
            .attr("y1", function(d) { return citBottom - z(d) * 2; })
            .attr("y2", function(d) { return citBottom - z(d) * 2; })
            .attr("stroke", "#666")
            .style("stroke-dasharray", "2,2");

        svg.selectAll(".szLbl")
            .data(valuesToShow)
            .enter()
            .append("text")
            .attr("class", "szLbl")
            .attr("x", xLabel + 3)
            .attr("y", function(d) { return citBottom - z(d) * 2; })
            .text(function(d) { return d; })
            .style("font-size", 9)
            .attr("alignment-baseline", "middle");
    </script>
</body>
</html>
