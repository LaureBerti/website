    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }
        
        #my_dataviz {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            max-width: 100%;
            overflow-x: auto;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        
        .bubbles {
            stroke-width: 2px;
            stroke: white;
            opacity: .85;
            transition: opacity 0.3s;
        }
        
        .bubbles:hover {
            stroke: #333;
            stroke-width: 3px;
            opacity: 1;
        }
        
        .tooltip {
            position: absolute;
            pointer-events: none;
            font-size: 14px;
            line-height: 1.6;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            body {
                margin: 10px;
            }
            
            #my_dataviz {
                padding: 10px;
            }
            
            h1 {
                font-size: 1.5rem;

        // Parse CSV data
        var data = d3.csvParse(csvData);
        
        // Convert strings to numbers
        data.forEach(function(d) {
            d.year = +d.year;
            d.citations = +d.citations;
            d.authors = +d.authors;
        });

        // Set the dimensions and margins of the graph
        var margin = {top: 40, right: 200, bottom: 80, left: 60};
        var width = Math.min(1000, window.innerWidth - 40) - margin.left - margin.right;
        var height = Math.min(600, window.innerHeight - 200) - margin.top - margin.bottom;

        // Append the svg object to the body of the page
        var svg = d3.select("#my_dataviz")
            .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

        // ---------------------------//
        //       AXIS AND SCALE       //
        // ---------------------------//

        // Add X axis (Year)
        var x = d3.scaleLinear()
            .domain([1997, 2026])
            .range([0, width]);
        svg.append("g")
            .attr("transform", "translate(0," + height + ")")
            .call(d3.axisBottom(x).ticks(15).tickFormat(d3.format("d")));

        // Add X axis label
        svg.append("text")
            .attr("text-anchor", "middle")
            .attr("x", width / 2)
            .attr("y", height +40)
            .style("font-size", "12px")
            .style("font-weight", "bold")
            .text("Year");

        // Add Y axis (Nb of authors)
        var y = d3.scaleLinear()
            .domain([0, 8])
            .range([height, 0]);
        svg.append("g")
            .call(d3.axisLeft(y).ticks(6).tickFormat(function(d) {
                return (d ) ;
            }));

        // Add Y axis label
        svg.append("text")
            .attr("text-anchor", "middle")
            .attr("transform", "rotate(-90)")
            .attr("y", -45)
            .attr("x", -height / 2)
            .style("font-size", "14px")
            .style("font-weight", "bold")
            .text("Number of authors");

        // Add a scale for bubble size (number of citations)
        var z = d3.scaleSqrt()
            .domain([1, 4])
            .range([1, 4]);

        // Add a scale for bubble color (topic)
        var myColor = d3.scaleOrdinal()
            .domain([
                "Fact-Checking / Truth Discovery",
                "Multimodal Fusion & Learning",
                "Applied Data Analytics & ML",
                "Uncertainty Quantification",
                "Data Quality / Data Cleaning",
                "Knowledge Engineering"
            ])
            .range(["#e74c3c", "#3498db", "#2ecc71", "#f39c12", "#9b59b6", "#1abc9c"]);

        // ---------------------------//
        //      TOOLTIP               //
        // ---------------------------//

        var tooltip = d3.select("#my_dataviz")
            .append("div")
            .style("opacity", 0)
            .attr("class", "tooltip")
            .style("background-color", "rgba(0, 0, 0, 0.9)")
            .style("border-radius", "8px")
            .style("padding", "12px")
            .style("color", "white")
            .style("box-shadow", "0 4px 6px rgba(0,0,0,0.1)");

        var showTooltip = function(d) {
            tooltip
                .transition()
                .duration(200)
                .style("opacity", 1);
            tooltip
                .html(
                    "<strong>" + d.venue + " " + d.year + "</strong><br/>" +
                    "Topic: " + d.topic + "<br/>" +
                    "Authors: " + d3.format(",")(d.authors) + "<br/>" +
                    "Citations: " + d.citations
                )
                .style("left", (d3.event.pageX + 15) + "px")
                .style("top", (d3.event.pageY - 28) + "px");
        };

        var moveTooltip = function(d) {
            tooltip
                .style("left", (d3.event.pageX + 15) + "px")
                .style("top", (d3.event.pageY - 28) + "px");
        };

        var hideTooltip = function(d) {
            tooltip
                .transition()
                .duration(200)
                .style("opacity", 0);
        };

        // ---------------------------//
        //       HIGHLIGHT GROUP      //
        // ---------------------------//

        var highlight = function(d) {
            d3.selectAll(".bubbles").style("opacity", 0.1);
            d3.selectAll("." + d.replace(/[^a-zA-Z0-9]/g, '_')).style("opacity", 1);
        };

        var noHighlight = function(d) {
            d3.selectAll(".bubbles").style("opacity", 0.85);
        };

        // ---------------------------//
        //       CIRCLES              //
        // ---------------------------//

        svg.append('g')
            .selectAll("dot")
            .data(data)
            .enter()
            .append("circle")
            .attr("class", function(d) {
                return "bubbles " + d.topic.replace(/[^a-zA-Z0-9]/g, '_');
            })
            .attr("cx", function(d) { return x(d.year); })
            .attr("cy", function(d) { return y(d.authors); })
            .attr("r", function(d) { return z(d.citations); })
            .style("fill", function(d) { return myColor(d.topic); })
            .on("mouseover", showTooltip)
            .on("mousemove", moveTooltip)
            .on("mouseleave", hideTooltip);

        // ---------------------------//
        //       LEGEND               //
        // ---------------------------//

        // Size legend (Authors)
        var valuesToShow = [10, 100, 300];
        var xCircle = width - 160+200;
        var xLabel = width - 60+200;
        
        svg.selectAll("legend")
            .data(valuesToShow)
            .enter()
            .append("circle")
            .attr("cx", xCircle)
            .attr("cy", function(d) { return height - 150 - z(d); })
            .attr("r", function(d) { return z(d); })
            .style("fill", "none")
            .attr("stroke", "#666");

        svg.selectAll("legend")
            .data(valuesToShow)
            .enter()
            .append("line")
            .attr('x1', function(d) { return xCircle + z(d); })
            .attr('x2', xLabel)
            .attr('y1', function(d) { return height - 150 - z(d); })
            .attr('y2', function(d) { return height - 150 - z(d); })
            .attr('stroke', '#666')
            .style('stroke-dasharray', '2,2');

        svg.selectAll("legend")
            .data(valuesToShow)
            .enter()
            .append("text")
            .attr('x', xLabel)
            .attr('y', function(d) { return height - 150 - z(d); })
            .text(function(d) { return d + " "; })
            .style("font-size", 9)
            .attr('alignment-baseline', 'middle');

        // Legend title
        svg.append("text")
            .attr('x', xCircle)
            .attr("y", height - 255)
            .text("Number of Citations")
            .style("font-weight", "bold")
            .style("font-size", "12px")
            .attr("text-anchor", "right");

        // Topic legend
        var size = 11;
        var allgroups = [
            "Fact-Checking / Truth Discovery",
            "Multimodal Fusion & Learning",
            "Applied Data Analytics & ML",
            "Uncertainty Quantification",
            "Data Quality / Data Cleaning",
            "Knowledge Engineering"
        ];

        svg.selectAll("myrect")
            .data(allgroups)
            .enter()
            .append("circle")
            .attr("cx", width - 180+200)
            .attr("cy", function(d, i) { return 10 + i * (size + 5); })
            .attr("r", 7)
            .style("fill", function(d) { return myColor(d); })
            .style("cursor", "pointer")
            .on("mouseover", function(d) { highlight(d); })
            .on("mouseleave", function(d) { noHighlight(d); });

        svg.append("text")
            .attr('x', xCircle)
            .attr("y", height - 370)
            .text("Topics")
            .style("font-weight", "bold")
            .style("font-size", "12px")
            .attr("text-anchor", "left");

        svg.selectAll("mylabels")
            .data(allgroups)
            .enter()
            .append("text")
            .attr("x", width - 165+200)
            .attr("y", function(d, i) { return 10 + i * (size + 5); })
            .style("fill", function(d) { return myColor(d); })
            .text(function(d) { return d; })
            .attr("text-anchor", "left")
            .style("alignment-baseline", "middle")
            .style("font-size", "11px")
            .style("cursor", "pointer")
            .on("mouseover", function(d) { highlight(d); })
            .on("mouseleave", function(d) { noHighlight(d); });
    </script>
